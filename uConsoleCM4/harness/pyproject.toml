[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lapis-harness"
version = "0.1.0"
description = "Lapis-Deck agentic harness: Fleet Shepherd (VNC/SSH over Tailscale), remote CLI harness bridge, local cyberdeck MCP tools"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9",
    "pillow>=10",
    "aiohttp>=3.14",  # web.RequestKey
    "cryptography>=42",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# Live fleet drivers (lazily imported; not needed for --mock). The LLM adapters use
# aiohttp directly: the anthropic SDK costs 35-50 MB RSS on a small board.
kvm = [
    # Pinned: vnc_driver reads frames through asyncvnc internals to work around
    # its swapped Bell/ServerCutText message types (see VncDriver._read_frame).
    "asyncvnc==1.3.0",
    "asyncssh>=2.15",
]
# Everything the uConsole image installs.
device = [
    "lapis-harness[kvm]",
]

[project.scripts]
lapis-harness = "lapis_harness.main:main"
lapis-mcp = "lapis_harness.mcp:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    # The SSH and VNC tests drive the real drivers against in-process fake hosts.
    "asyncvnc==1.3.0",
    "asyncssh>=2.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lapis_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
