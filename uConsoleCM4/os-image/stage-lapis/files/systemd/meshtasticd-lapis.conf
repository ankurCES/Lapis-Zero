[Unit]
# The SX1262 needs its rail (GPIO16 on AIO V2) before the daemon probes it: meshtasticd exits
# with "No sx1262 radio" otherwise. lapis-rails leaves /run/lapis-rails/lora only when the
# rail is on (or the board is a V1); without it the unit is skipped, not failed.
After=lapis-rails.service
Wants=lapis-rails.service
ConditionPathExists=/run/lapis-rails/lora

[Service]
# A node ID that does not depend on Bluetooth being up (see lapis-meshtasticd.sh).
ExecStart=
ExecStart=/usr/lib/lapis/lapis-meshtasticd.sh
