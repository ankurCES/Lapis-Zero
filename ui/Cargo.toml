[package]
name = "lapis-ui"
version = "0.1.0"
edition = "2021"
description = "Lapis-Zero OS 320x170 software-rendered UI"
publish = false

[features]
default = ["sim"]
# Desktop SDL2 simulator. Links the system SDL2 found via pkg-config (no bundled build).
sim = ["dep:sdl2"]

[dependencies]
png = "0.17"
sdl2 = { version = "0.37", optional = true, default-features = false, features = ["use-pkgconfig", "unsafe_textures"] }
