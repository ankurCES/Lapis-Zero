# /etc/lapis/lapis.toml — Lapis-Zero OS defaults shipped in the image.
# Every key is optional; see config/lapis.example.toml for the full reference.
# Secrets never go here: they live in /etc/lapis/secrets.env (0600).

[llm]
provider = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
max_steps = 25

[voice]
enabled = false

[cron]
enabled = true
