[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lapis-daemon"
version = "0.1.0"
description = "Lapis-Zero OS autonomous Option C KVM agent daemon"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[project.scripts]
lapis-daemon = "lapis_daemon.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lapis_daemon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
